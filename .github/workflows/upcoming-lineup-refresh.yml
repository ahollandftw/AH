name: Upcoming Lineup Refresh

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh projections for games starting within 60 minutes
        run: |
          curl -sf -X POST "${{ secrets.API_BASE_URL }}/bdl/sync/projections/upcoming" \
            -H "Content-Type: application/json" \
            -d '{"window_minutes":60}' \
            --max-time 120
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
