name: Statcast daily ingest

on:
  schedule:
    # 11:00 UTC ≈ 6:00 Eastern (standard); adjust for DST if needed
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  ingest-and-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r scripts/statcast/requirements.txt

      - name: Run Statcast ingestion (incremental)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/statcast/ingest_statcast.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Run aggregation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run aggregate

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data '{"text":"Statcast daily workflow failed for ${{ github.repository }} — check Actions logs."}' \
              "$SLACK_WEBHOOK_URL" || true
          fi
