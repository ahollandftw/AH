name: Statcast daily ingest

on:
  schedule:
    # 11:00 UTC ≈ 6:00 Eastern (standard); adjust for DST if needed
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  ingest-and-aggregate:
    runs-on: ubuntu-latest
    # URL may be a non-secret repo Variable; service role key must be a Secret.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase credentials
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Missing Supabase credentials. Add repository Actions secrets: SUPABASE_SERVICE_ROLE_KEY (required). Add SUPABASE_URL as a secret or set Variables → SUPABASE_URL with your project URL (https://xxx.supabase.co)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r scripts/statcast/requirements.txt

      - name: Run Statcast ingestion (incremental)
        run: python scripts/statcast/ingest_statcast.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Run aggregation
        run: npm run aggregate

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data '{"text":"Statcast daily workflow failed for ${{ github.repository }} — check Actions logs."}' \
              "$SLACK_WEBHOOK_URL" || true
          fi
