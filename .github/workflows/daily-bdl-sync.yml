name: Daily BDL Sync

on:
  schedule:
    # 10:00 AM Central = 15:00 UTC (CDT) / 16:00 UTC (CST)
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
    steps:
      - name: Validate API base URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is not configured in GitHub Actions vars or secrets."
            exit 1
          fi
          case "$API_BASE_URL" in
            http://*|https://*) ;;
            *)
              echo "API_BASE_URL must be a full http(s) URL, got: $API_BASE_URL"
              exit 1
              ;;
          esac
      - name: Trigger daily sync
        run: |
          curl -sf -X POST "$API_BASE_URL/bdl/sync/daily" \
            -H "Content-Type: application/json" \
            --max-time 3600

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"text":"⚠️ Daily BDL sync failed. Check GitHub Actions."}'
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
