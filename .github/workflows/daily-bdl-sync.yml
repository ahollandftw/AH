name: Daily BDL Sync

on:
  schedule:
    # ~8:00 AM Eastern (13:00 UTC during EDT)
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.set.outputs.api_url }}
    steps:
      - name: Validate and export API_BASE_URL
        id: set
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is not configured in GitHub Actions vars or secrets."
            exit 1
          fi
          case "$API_BASE_URL" in
            http://*|https://*) ;;
            *)
              echo "API_BASE_URL must be a full http(s) URL, got: $API_BASE_URL"
              exit 1
              ;;
          esac
          echo "api_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"

  # Phase 1: Sync players, games, season stats (fast BDL fetches)
  phase1-players-games-stats:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: ${{ needs.validate.outputs.api_url }}
    steps:
      - name: Sync active players
        run: |
          curl -sf -X POST "$API_BASE_URL/bdl/sync/players" \
            -H "Content-Type: application/json" \
            --max-time 300
      - name: Sync games for today
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          curl -sf -X POST "$API_BASE_URL/bdl/sync/games" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$TODAY\"}" \
            --max-time 120
      - name: Sync season stats
        run: |
          curl -sf -X POST "$API_BASE_URL/bdl/sync/season-stats" \
            -H "Content-Type: application/json" \
            -d '{"season":2026}' \
            --max-time 300

  # Phase 2: Sync player props for today's games (one call per game)
  phase2-props:
    needs: phase1-players-games-stats
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: ${{ needs.validate.outputs.api_url }}
    steps:
      - name: Sync player props for today
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          curl -sf -X POST "$API_BASE_URL/bdl/sync/props-today" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$TODAY\"}" \
            --max-time 300

  # Phase 3a: Default model projections (matchup-based, most coverage)
  phase3a-projections-default:
    needs: phase2-props
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: ${{ needs.validate.outputs.api_url }}
    steps:
      - name: Run default projections for today
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          curl -sf -X POST "$API_BASE_URL/bdl/sync/projections" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$TODAY\",\"model_variant\":\"default\"}" \
            --max-time 300
      - name: Run default projections for tomorrow
        run: |
          TOMORROW=$(TZ=America/New_York date -d "+1 day" +%Y-%m-%d)
          curl -sf -X POST "$API_BASE_URL/bdl/sync/projections" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$TOMORROW\",\"model_variant\":\"default\"}" \
            --max-time 300 || echo "No games tomorrow, skipped"

  # Phase 3b: Weighted pitch arsenal model
  phase3b-projections-weighted:
    needs: phase3a-projections-default
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: ${{ needs.validate.outputs.api_url }}
    steps:
      - name: Run weighted_pitch_arsenal projections for today
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          curl -sf -X POST "$API_BASE_URL/bdl/sync/projections" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$TODAY\",\"model_variant\":\"weighted_pitch_arsenal\"}" \
            --max-time 300

  # Phase 3c: Contact quality model (Statcast-heavy, requires lineup data)
  phase3c-projections-contact:
    needs: phase3b-projections-weighted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: ${{ needs.validate.outputs.api_url }}
    steps:
      - name: Run contact_quality projections for today
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          curl -sf -X POST "$API_BASE_URL/bdl/sync/projections" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$TODAY\",\"model_variant\":\"contact_quality\"}" \
            --max-time 300

  notify-failure:
    needs: [phase1-players-games-stats, phase2-props, phase3a-projections-default, phase3b-projections-weighted, phase3c-projections-contact]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"text":"⚠️ Daily BDL sync failed. Check GitHub Actions."}'
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
